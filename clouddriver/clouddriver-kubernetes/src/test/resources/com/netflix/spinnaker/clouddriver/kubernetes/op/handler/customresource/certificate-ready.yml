# cert-manager Certificate once issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-cert
  namespace: default
  generation: 2
spec:
  secretName: my-cert-tls
  dnsNames:
    - example.com
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: Certificate is up to date and has not expired
      observedGeneration: 2
  notAfter: "2026-12-28T00:00:00Z"
