name: Spinnaker BoM/Changelog/Github Release
run-name: Spinnaker BoM/Changelog/Github (${{ inputs.spinnaker-version }})

on:
  workflow_call:
    inputs:
      add-to-versions-yml:
        description: Add this version to `versions.yml` for Halyard?
        type: boolean
        default: true
      spinnaker-version:
        description: The Spinnaker version to publish a BoM/changelog for
        type: string
        required: true
      spinnaker-previous-version:
        description: Override the previous version used for changelog generation (picks the last patch version if unset)
        type: string
      publish-bom:
        description: Publish BoM?
        type: boolean
        default: true
      publish-changelog:
        description: Publish changelog?
        type: boolean
        default: true
      publish-github-release:
        description: Publish Github release?
        type: boolean
        default: true
      allow-bom-overwrite:
        description: Allow BoM overwrite if it already exists?
        type: boolean
        default: false
      publish-api-docs:
        description: Publish Gate's OpenAPI spec to the docs site?
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      add-to-versions-yml:
        description: Add this version to `versions.yml` for Halyard?
        type: boolean
        default: true
      spinnaker-version:
        description: The Spinnaker version to publish a BoM/changelog for
        type: string
        required: true
      spinnaker-previous-version:
        description: Override the previous version used for changelog generation (picks the last patch version if unset)
        type: string
      publish-bom:
        description: Publish BoM?
        type: boolean
        default: true
      publish-changelog:
        description: Publish changelog?
        type: boolean
        default: true
      publish-github-release:
        description: Publish Github release?
        type: boolean
        default: true
      allow-bom-overwrite:
        description: Allow BoM overwrite if it already exists?
        type: boolean
        default: false
      publish-api-docs:
        description: Publish Gate's OpenAPI spec to the docs site?
        type: boolean
        default: true

jobs:
  check-preconditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Exit if not on a release branch
        run: |
          REF="${{ github.ref_name }}"
          
          if  [[ $REF != release-* ]]; then
            echo "Release workflow must be run from a release branch"
            exit 1
          fi

      - name: Generate version to verify
        id: precondition-version
        uses: ./.github/actions/version
        with:
          namespace: spinnaker
          is-release: true
          skip-increment: true
          skip-tag: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check branch matches desired version
        run: |
          REF="${{ github.ref_name }}"
          REQUIRED_REF='release-${{ steps.precondition-version.outputs.release-train-suffixed }}'
          
          if [[ $REF != $REQUIRED_REF ]]; then
            echo "Wrong release branch - please run from $REQUIRED_REF"
            exit 1
          fi

  spinnaker-release-bom:
    runs-on: ubuntu-latest
    needs: check-preconditions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            spinnaker.io
            spinnaker

      - uses: actions/setup-java@v6
        if: inputs.publish-api-docs == true
        with:
          java-version: |
            17
          distribution: 'zulu'
          cache: gradle

      - name: Generate Gate OpenAPI spec
        if: inputs.publish-api-docs == true
        run: ./gradlew :gate:swagger

      - name: Create Spinnaker release BoM and changelog
        id: spinnaker-release-bom
        uses: ./.github/actions/spinnaker-release
        with:
          ## https://github.com/octokit/auth-token.js/?tab=readme-ov-file#use-token-for-git-operations Since using a GHA, must prefix with x-access-token apparently.
          github-pat:  x-access-token:${{ steps.app-token.outputs.token }}
          credentials-json: ${{ secrets.GAR_JSON_KEY }}
          version: ${{ inputs.spinnaker-version }}
          previous-version: ${{ inputs.spinnaker-previous-version }}
          add-to-versions-yml: ${{ inputs.add-to-versions-yml }}
          publish-bom: ${{ inputs.publish-bom }}
          publish-changelog: ${{ inputs.publish-changelog }}
          allow-bom-overwrite: ${{ inputs.allow-bom-overwrite }}
          publish-api-docs: ${{ inputs.publish-api-docs }}
          swagger-json-path: gate/swagger/swagger.json

      - name: Create Github release
        if: inputs.publish-github-release == true
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: spinnaker-release-${{ inputs.spinnaker-version }}
          release_name: Spinnaker ${{ inputs.spinnaker-version }}
          body: |
            ${{ steps.spinnaker-release-bom.outputs.changelog }}
          draft: false
          prerelease: false

      # Every service's app-dependency (CycloneDX) and container-image (SPDX) SBOMs land here as
      # workflow artifacts from the reusable per-service workflows invoked earlier in this run.
      # No continue-on-error here or below: SBOMs are a compliance requirement for this release,
      # not a nice-to-have, so a missing/failed SBOM must fail the release rather than skip quietly.
      - name: Download service SBOMs
        if: inputs.publish-github-release == true
        uses: actions/download-artifact@v4
        with:
          path: sboms
          pattern: 'sbom-*'
          merge-multiple: true

      - name: Download image SBOMs
        if: inputs.publish-github-release == true
        uses: actions/download-artifact@v4
        with:
          path: sboms
          pattern: 'image-sbom-*'
          merge-multiple: true

      # Uploads each SBOM as a release asset and links (not embeds) them from the release notes,
      # appended after the changelog actions/create-release already set as the body.
      - name: Attach SBOMs to release and link them from the release notes
        if: inputs.publish-github-release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: spinnaker-release-${{ inputs.spinnaker-version }}
          CHANGELOG: ${{ steps.spinnaker-release-bom.outputs.changelog }}
        run: |
          shopt -s nullglob

          # Every Gradle-based service in this release must have produced an app SBOM. A missing
          # one means SBOM generation silently broke somewhere upstream -- fail loudly rather than
          # publish a release with incomplete supply-chain documentation.
          EXPECTED_SERVICES=(clouddriver echo fiat front50 gate igor kayenta keel orca rosco)
          MISSING=()
          for svc in "${EXPECTED_SERVICES[@]}"; do
            if ! compgen -G "sboms/${svc}-app-sbom.cdx.json" > /dev/null; then
              MISSING+=("$svc")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing app SBOM for: ${MISSING[*]} -- SBOMs are required for this release."
            exit 1
          fi

          FILES=(sboms/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No SBOM artifacts found at all -- SBOMs are required for this release."
            exit 1
          fi

          gh release upload "$TAG" "${FILES[@]}" --clobber

          {
            printf '%s\n\n' "$CHANGELOG"
            echo "## SBOMs"
            echo
            echo "CycloneDX application-dependency and SPDX container-image SBOMs for every service in this release:"
            echo
            for f in "${FILES[@]}"; do
              name=$(basename "$f")
              echo "- [$name](https://github.com/${{ github.repository }}/releases/download/$TAG/$name)"
            done
          } > release-notes-with-sboms.md

          gh release edit "$TAG" --notes-file release-notes-with-sboms.md

      - name: Summarize
        shell: bash
        run: |
          SBOM_COUNT=$(find sboms/ -type f 2>/dev/null | wc -l | tr -d ' ')
          cat <<EOF> "$GITHUB_STEP_SUMMARY"
          ### Release Info
          | | |
          | --- | --- |
          | __Version__ | ${{ inputs.spinnaker-version }} |
          | __BoM__ | ${{ steps.spinnaker-release-bom.outputs.bom-url }} |
          | __Changelog__ | ${{ steps.spinnaker-release-bom.outputs.bom-url }} |
          | __versions.yml__ | ${{ steps.spinnaker-release-bom.outputs.versions-yml-url }} |
          | __SBOMs attached__ | $SBOM_COUNT |
          <details>
          <summary>BoM Contents</summary>
          
          ```
          ${{ steps.spinnaker-release-bom.outputs.bom }}
          ```
          </details>
          <details>
          <summary>Changelog Contents</summary>
          
          ```
          ${{ steps.spinnaker-release-bom.outputs.changelog }}
          ```
          </details>
          <details>
          <summary>versions.yml Contents</summary>
          
          ```
          ${{ steps.spinnaker-release-bom.outputs.versions-yml }}
          ```
          </details>
          EOF
