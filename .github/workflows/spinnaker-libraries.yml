name: Spinnaker Libraries
run-name: Libraries ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      version-override:
        description: Overrides the version for artifacts (e.g. "1.37.1").  Otherwise, uses the auto-incrementing build number for the current branch.
        type: string

  workflow_dispatch:
    inputs:
      version-override:
        description: Overrides the version for artifacts (e.g. "1.37.1").  Otherwise, uses the auto-incrementing build number for the current branch.
        type: string

  push:
    branches:
      - main
      - release-*
    paths:
      - 'clouddriver/**'
      - 'echo/**'
      - 'fiat/**'
      - 'front50/**'
      - 'gate/**'
      - 'igor/**'
      - 'kayenta/**'
      - 'keel/**'
      - 'kork/**'
      - 'orca/**'
      - 'rosco/**'

jobs:
  libraries-nexus:
    runs-on: ubuntu-latest
    concurrency:
      group: spinnaker-libraries-${{ inputs.version-override || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/version
        id: version
        with:
          namespace: spinnaker-libraries
          version-override: ${{ inputs.version-override }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          java-version: |
            25
          distribution: zulu
          cache: ${{ !env.ACT && 'gradle' || '' }} # Disable Gradle cache when running actions locally

      - name: Publish Nexus libraries
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_nexusPublishEnabled: true
          ORG_GRADLE_PROJECT_nexusUsername: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_nexusPgpSigningKey: ${{ secrets.NEXUS_PGP_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_nexusPgpSigningPassword: ${{ secrets.NEXUS_PGP_SIGNING_PASSWORD }}
        run: |
          ./gradlew assemble publishToNexus

      - name: Close and release Nexus staging repository
        id: nexus-release
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_nexusPublishEnabled: true
          ORG_GRADLE_PROJECT_nexusUsername: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_nexusPgpSigningKey: ${{ secrets.NEXUS_PGP_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_nexusPgpSigningPassword: ${{ secrets.NEXUS_PGP_SIGNING_PASSWORD }}
        run: |
          ./gradlew --stacktrace findNexusStagingRepository closeAndReleaseNexusStagingRepository

      - name: Report incomplete Maven publication
        if: ${{ failure() && steps.nexus-release.outcome == 'failure' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error title=Maven publication incomplete::Nexus staging close/release failed for ${RELEASE_VERSION}. Some libraries may be missing from Maven Central."
          {
            echo "### Maven publication incomplete: ${RELEASE_VERSION}"
            echo
            echo "Library uploads completed, but Nexus staging close/release failed."
            echo "See the Gradle output for failed tasks and staging repository IDs."
            echo "Run [Recover Spinnaker Libraries](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/spinnaker-libraries-recover.yml) with this version and the failed staging repository IDs."
            echo "See the [recovery runbook](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/spinnaker-gradle-project/spinnaker-project-plugin/src/main/groovy/com/netflix/spinnaker/gradle/publishing/nexus/README.md#recovering-a-partially-published-release) for checkpoint recovery and unresolved transfers."
          } >> "$GITHUB_STEP_SUMMARY"
