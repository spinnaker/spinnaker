// Compatibility artifact: classes are owned and published by Kork.
dependencies {
  api "io.spinnaker.kork:kork-authz"
}

// Compile and run the same external consumer against both published dependency pairs.
sourceSets {
  legacyConsumer {
    java.srcDir 'src/consumer/java'
  }
  korkConsumer {
    java.srcDir 'src/consumer/java'
  }
}

dependencies {
  legacyConsumerImplementation project(':fiat-api')
  legacyConsumerImplementation project(':fiat-core')
  korkConsumerImplementation "io.spinnaker.kork:kork-authz"
  korkConsumerImplementation "io.spinnaker.kork:kork-authz-api"
}

['legacyConsumer', 'korkConsumer'].each { consumer ->
  tasks.register("${consumer}Test", JavaExec) {
    group = 'verification'
    description = "Compiles and runs an authorization consumer using ${consumer} dependencies."
    classpath = sourceSets[consumer].runtimeClasspath
    mainClass = 'com.netflix.spinnaker.fiat.compatibility.AuthorizationConsumer'
  }
}

tasks.register('consumerCompatibilityTest') {
  group = 'verification'
  description = 'Verifies both dependency pairs and class-free Fiat compatibility jars.'
  dependsOn 'legacyConsumerTest', 'korkConsumerTest', 'jar', ':fiat-core:jar'
  doLast {
    [project, project(':fiat-core')].each { compatibilityProject ->
      def artifact = compatibilityProject.tasks.named('jar').get().archiveFile.get().asFile
      assert zipTree(artifact).matching { include '**/*.class' }.empty:
        "Compatibility artifact ${artifact.name} must not contain classes"
    }
    ['korkConsumerCompileClasspath', 'korkConsumerRuntimeClasspath'].each { name ->
      def fiatComponents = configurations[name].incoming.resolutionResult.allDependencies.findAll {
        it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult &&
          it.selected.moduleVersion?.group == 'io.spinnaker.fiat'
      }
      assert fiatComponents.empty: "Kork authorization depends on Fiat: ${fiatComponents}"
    }
  }
}

tasks.named('test') {
  dependsOn 'consumerCompatibilityTest'
}
tasks.named('check') {
  dependsOn 'consumerCompatibilityTest'
}
