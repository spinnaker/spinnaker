// Single home for the WireMock version used with Spring Boot 4.1. Each
// composite build applies this script from its root build.gradle:
//
//   apply from: "../wiremock-substitution.gradle"
//
// WireMock 3.x's default Jetty 11 server (and the jetty12 variant's Jetty
// 12.0.x) conflicts with Boot 4.1's managed Jetty 12.1.x on test classpaths
// (HttpServerFactoryLoader finds no loadable factory); newer 3.x releases
// still default to Jetty 11, so the conflict persists there. The shaded
// standalone artifact is self-contained, so substitute it for all WireMock
// usage. The kork-bom platform (spinnaker-dependencies) constrains these
// artifacts to the same version for dependency resolution.
def wiremockVersion = "3.13.2"

allprojects {
  configurations.all {
    resolutionStrategy.dependencySubstitution {
      substitute(module("org.wiremock:wiremock")).using(
          module("org.wiremock:wiremock-standalone:${wiremockVersion}"))
      substitute(module("org.wiremock:wiremock-jetty12")).using(
          module("org.wiremock:wiremock-standalone:${wiremockVersion}"))
    }
  }
}
