dependencies {
  implementation project(':gate-core')
  implementation 'io.spinnaker.kork:kork-core'
  implementation 'io.spinnaker.kork:kork-crypto'
  implementation 'io.spinnaker.kork:kork-exceptions'
  implementation 'io.spinnaker.kork:kork-security'
  implementation "io.spinnaker.fiat:fiat-api"
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // Brings the SAML2 relying-party auto-configuration and standard
  // spring.security.saml2.relyingparty.* properties (spring-boot-security-saml2).
  implementation 'org.springframework.boot:spring-boot-starter-security-saml2'
  implementation 'org.springframework.session:spring-session-core'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
