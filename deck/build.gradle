import java.nio.file.Paths
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.redline_rpm.header.Flags

plugins {
  id "io.spinnaker.artifactregistry-publish"
  id "com.github.node-gradle.node" version "7.0.1"
  id "com.netflix.nebula.ospackage"  version "12.3.0"
}

group = "com.netflix.spinnaker.deck"

node {
  // Pulls node version from package.json.
  def packageSlurper = new JsonSlurper()
  def packageJson = packageSlurper.parse file('package.json')
  def packageManager = packageJson.packageManager
  def pnpmVersionMatcher = packageManager instanceof String
    ? packageManager =~ /^pnpm@(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$/
    : null

  if (pnpmVersionMatcher == null || !pnpmVersionMatcher.matches()) {
    def actualPackageManager = packageManager == null ? 'missing' : "'${packageManager}'"
    throw new GradleException(
      "deck/package.json packageManager must be an exact pnpm version in the form 'pnpm@<major>.<minor>.<patch>'; found ${actualPackageManager}"
    )
  }

  version = packageJson.engines.node.replaceAll(/[^\d\.]/, '')
  pnpmVersion = pnpmVersionMatcher.group(1)
}

pnpmInstall {
  doNotTrackState("pnpm manages node_modules as a large symlink graph that Gradle cannot snapshot reliably")
}

task modules(type: PnpmTask) {
  dependsOn "pnpmInstall"

  pnpmCommand = ["modules"]
  environment = [
    "NODE_ENV": "production",
  ]
}

// Package builds write outside Gradle's build directory.
clean {
  delete file('.cache-loader')
  delete file('packages').listFiles()
    .findAll { it.isDirectory() }
    .collect { new File(it, 'dist') }
}

task eslintPluginCompile(type: PnpmTask) {
  dependsOn "modules"

  workingDir = file(Paths.get("packages", "eslint-plugin"))
  pnpmCommand = ["tsc"]
}

task eslintPluginTest(type: PnpmTask) {
  dependsOn "eslintPluginCompile"

  workingDir = file(Paths.get("packages", "eslint-plugin"))
  pnpmCommand = ["test"]
}

project.tasks.register('eslintPlugin') {
  dependsOn 'eslintPluginCompile'
  dependsOn 'eslintPluginTest'
}

task lint(type: PnpmTask) {
  dependsOn "eslintPlugin"

  pnpmCommand = ["lint"]
}

task prettier(type: PnpmTask) {
  dependsOn "eslintPlugin"
  dependsOn "lint"

  pnpmCommand = ["prettier:check"]
}

project.tasks.register('runLinters') {
  dependsOn "lint"
  dependsOn "prettier"
}

task unitTests(type: PnpmTask) {
  dependsOn "modules"

  pnpmCommand = ["test"]

  if (project.hasProperty('skipTests')) {
    unitTests.enabled = false
  }
}

task functionalTests(type: PnpmTask) {
  dependsOn "modules"
  dependsOn "unitTests"

  pnpmCommand = ["functional"]

  if (project.hasProperty('skipTests')) {
    functionalTests.enabled = false
  }
}

project.tasks.register('test') {
  dependsOn 'unitTests'
  dependsOn 'functionalTests'
}

task typecheck(type: PnpmTask) {
  dependsOn "modules"

  pnpmCommand = ["typecheck"]
}

task viteBuild(type: PnpmTask) {
  dependsOn "pnpmInstall"
  dependsOn "modules"
  dependsOn "typecheck"

  pnpmCommand = ["build"]
  environment = [
    "NODE_ENV": "production",
    "GATE_HOST": "spinnaker-api-prestaging.prod.netflix.net",
    "NODE_OPTIONS": "--max_old_space_size=8192",
  ]
}
viteBuild.inputs.file file('version.json')
viteBuild.outputs.dir file('packages/app/dist')

task generateVersionFile {
  doLast {
    'git update-index --assume-unchanged version.json'.execute()
    def buildInfo = [
      version: project.hasProperty('deckVersion') ? "${deckVersion}" : "n/a",
      created: new Date().getTime()
    ]
    def buildJson = JsonOutput.prettyPrint(JsonOutput.toJson(buildInfo))
    file("version.json").write(buildJson)
  }
}
pnpmInstall.dependsOn 'generateVersionFile'

buildDeb.dependsOn 'viteBuild'
buildRpm.dependsOn 'viteBuild'
build.dependsOn 'buildDeb'

build.dependsOn 'test'
build.dependsOn 'runLinters'

String toVers(String v) {
  int idx = v.indexOf('-')
  if (idx != -1) {
    return v.substring(0, idx)
  }
  return v
}

String toRelease(String v) {
  int idx = v.lastIndexOf('-')
  if (idx != -1) {
    return v.substring(idx + 1)
  }
  return ''
}

ospackage {
  packageName = "spinnaker-deck"
  version = toVers(project.version.toString())
  release toRelease(project.version.toString())
  into "/opt/deck/html"
  from "packages/app/dist"
  os = LINUX
}

buildRpm {
  requires('httpd')
}

buildDeb {
  requires('apache2', '2.4.7', Flags.GREATER | Flags.EQUAL)
}
