packages:
  - 'packages/*'
overrides:
  '@types/react': 16.14.10
  '@uirouter/core': 6.0.8
  '@uirouter/react': 1.0.7
  cheerio: 1.0.0-rc.3
  nth-check: 2.0.1
  react: ^16.14.0
  react-dom: ^16.14.0
  rxjs: 6.6.7
  # lerna's own inquirer dependency needs a modern rxjs; the blanket
  # override above must not force it down to 6.6.7 or `lerna publish`
  # crashes at startup (inquirer's ESM build imports `concatMap` from
  # 'rxjs', which rxjs 6 only exposes via 'rxjs/operators').
  inquirer@12>rxjs: ^7.8.2
  typescript: 5.0.4
packageExtensions:
  # rxjs-compat imports 'rxjs' without declaring it, so it otherwise resolves whichever rxjs pnpm
  # hoists. With inquirer's rxjs 7 in the graph, that can be 7.x, which breaks the rxjs-5 style
  # imports (e.g. 'rxjs/observable/from') used by kayenta. Pin it to the rxjs 6 line it belongs to.
  rxjs-compat@6.6.7:
    dependencies:
      rxjs: 6.6.7
allowBuilds:
  bufferutil: true
  core-js: true
  cypress: true
  esbuild: true
  nx: true
  utf-8-validate: true
