# Shared by the HTTP and HTTPS virtual hosts, within the document directory.
Options -MultiViews
RewriteEngine On

# Prefer Brotli, then gzip, when the client explicitly accepts the encoding.
# Match whole tokens and reject q=0 (including q=0.000).
RewriteCond %{REQUEST_URI} !(^|/)settings[^/]*\.js$ [NC]
RewriteCond %{HTTP:Accept-Encoding} "(^|,)\s*br\s*(;\s*q\s*=\s*(?!0(?:\.0*)?\s*(?:,|$))[01](?:\.[0-9]+)?\s*)?(,|$)" [NC]
RewriteCond %{REQUEST_FILENAME}.br -f
RewriteRule ^(.+\.(?:js|css))$ $1.br [L]

RewriteCond %{REQUEST_URI} !(^|/)settings[^/]*\.js$ [NC]
RewriteCond %{HTTP:Accept-Encoding} "(^|,)\s*gzip\s*(;\s*q\s*=\s*(?!0(?:\.0*)?\s*(?:,|$))[01](?:\.[0-9]+)?\s*)?(,|$)" [NC]
RewriteCond %{REQUEST_FILENAME}.gz -f
RewriteRule ^(.+\.(?:js|css))$ $1.gz [L]

# Caches must distinguish compressed and original responses in either order.
<FilesMatch "\.(js|css)(\.(gz|br))?$">
  Header merge Vary Accept-Encoding
</FilesMatch>

<FilesMatch "\.js\.(gz|br)$">
  ForceType application/javascript
</FilesMatch>
<FilesMatch "\.css\.(gz|br)$">
  ForceType text/css
</FilesMatch>
AddEncoding gzip .gz
AddEncoding br .br

<FilesMatch "\.(js|css)\.(gz|br)$">
  # Avoid passing already compressed responses through mod_deflate again.
  SetEnv no-gzip 1
</FilesMatch>

# Vite's content hashes make these files safe to cache across releases.
# Settings and other assets with stable names need normal revalidation.
<FilesMatch "^(?!settings).+-[A-Za-z0-9_-]{8}\.(js|css)(\.(gz|br))?$">
  Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
