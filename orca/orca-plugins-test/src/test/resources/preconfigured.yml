label: Custom Deploy
description: Runs a custom deploy
type: customDeploy
waitForCompletion: true
uiType: CUSTOM
parameters:
  - name: buildFolder
    mapping: manifest.spec.template.spec.containers[0].env[0].value
    defaultValue: build
    description: The folder to deploy (from the Jenkins Job)
    label: Build Folder
    order: 0
  - name: account
    mapping: credentials
    label: Kubernetes Account
    defaultValue: my-k8s-account
    order: 1
cloudProvider: kubernetes
credentials: my-k8s-account
manifest:
  apiVersion: batch/v1
  kind: Job
  metadata:
    name: custom-deploy
  spec:
    backoffLimit: 2
    template:
      spec:
        restartPolicy: Never
        containers:
          - name: custom-deploy
            image: example/custom-deploy:latest
            env:
              - name: BUILD_FOLDER
                value: build
