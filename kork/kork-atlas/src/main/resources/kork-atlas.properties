# kork-atlas module defaults. See docs/superpowers/specs/2026-06-08-kork-atlas-module-design.md
#
# MODERNE_ATLAS_URI is the env-var seam ops use to point each service at the
# labs Atlas endpoint. Falls back to Spring Boot's localhost default when unset
# (which is also where the registry would publish if enabled without an
# explicit URI).
management.atlas.metrics.export.uri=${MODERNE_ATLAS_URI:http://localhost:7101/api/v1/publish}

# Module ships dormant. The deploy mechanism flips both this and
# MODERNE_ATLAS_URI when the labs Atlas endpoint is ready.
management.atlas.metrics.export.enabled=false
