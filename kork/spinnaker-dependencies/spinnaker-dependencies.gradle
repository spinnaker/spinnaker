apply plugin: "java-platform"

javaPlatform {
  allowDependencies()
}

ext {
  versions = [
    arrow            : "0.13.2",
    aws              : "1.12.261",
    awsv2            : "2.23.7",
    bouncycastle     : "1.84", // fixes CVE-2024-34447, CVE-2025-14813
    gcp              : "26.34.0",
    groovy           : "4.0.15",
    jsch             : "0.1.54",
    jschAgentProxy   : "0.0.9",
    log4j            : "2.26.1", // CVEs regularly released, so patch override spring as needed
    log4jKotlin      : "1.5.0",
    protobuf         : "3.25.9",
    retrofit2        : "2.12.0",
    spectator        : "1.7.3", // watch to match what is coming from eureka which defines this, but not ALL the versions
    spek             : "1.1.5",
    elasticsearch    : "8.19.18", // Used by clouddriver, moved here for central dep management
    spek2            : "2.0.9",
    springdocs          : "2.8.17",
    springBoot       : "3.5.16",
    springCloud      : "2025.0.3", // CVE-2026-40982: spring-cloud-config-server 4.3.3+ required
    // bring in latest, though it's ahead of deps.  This is due to springdocs
    // https://github.com/springdoc/springdoc-openapi/blob/v2.8.17/springdoc-openapi-starter-common/src/main/java/org/springdoc/core/providers/ObjectMapperProvider.java#L85
    // referencing a field that didn't come in... until 2.2.30
    swagger          : "2.2.49",
    httpcore5        : "5.4.3",
    logback          : "1.5.37",
    tomcat           : "10.1.56",
    commonsCompress  : "1.27.1",
    testcontainersMinio : "2.0.5",
  ]
}

dependencies {
  /*
   * These are 3rd party BOMs we inherit from. Any version constraints they contain we get
   * transitively.
   *
   * Order matters somewhat here in that if multiple BOMs constrain the same things the FIRST wins.
   * For example, `junit-bom` and `jackson-bom` will win out over the versions of JUnit and Jackson
   * specified by `spring-boot-dependencies`.
   */

  // Without pinning jackson-bom to the version that spring boot 3.1.12 brings
  // in (2.15.4), we get a newer one from version 2.2.22 of swagger: 2.16.2.
  // Let's keep more of the code running with the version it expects.
  //kotlinVersion comes from gradle.properties since we have kotlin code in
  // this project and need to configure gradle plugins etc.
  api(platform(libs.kotlin.bom))
  // log4j-bom and netty-bom are declared here, before spring-boot-dependencies (and every
  // other BOM below), so that our pinned versions win when this platform is published as a
  // Maven POM and consumed by a downstream Maven-style build via an imported/enforced
  // platform. Gradle's own conflict resolution picks the highest version regardless of
  // declaration order, but Maven's <dependencyManagement> import resolution is strictly
  // "first import wins" - so if these came after spring-boot-dependencies in the generated
  // POM, Maven consumers would silently fall back to spring's older, nested netty-bom/log4j-bom
  // versions even though Gradle-based, build-from-source consumers would never see the problem.
  api(platform("org.apache.logging.log4j:log4j-bom:${versions.log4j}"))
  api(platform("io.netty:netty-bom:4.1.136.Final"))// 3.5.16 of spring brings in 4.1.135 which has a new CVE.  https://nvd.nist.gov/vuln/detail/CVE-2026-55831.  Remove post upgrade to latest 4 with a fix
  // httpcore5-parent is the officially published Maven coordinate management POM for the
  // httpcore5/httpcore5-h2 artifact family (see the "Maven Coordinates" section of the
  // Apache HttpComponents Core release docs). It has a real <dependencyManagement> pinning
  // httpcore5/httpcore5-h2 to ${project.version}, so it's a safe drop-in for our former
  // constraints{} pin. Declared here, before spring-boot-dependencies, for the same
  // import-order-safety reason as log4j-bom/netty-bom above.
  api(platform("org.apache.httpcomponents.core5:httpcore5-parent:${versions.httpcore5}"))
  api(platform("org.springframework.boot:spring-boot-dependencies:${versions.springBoot}"))
  api(platform("com.google.protobuf:protobuf-bom:${versions.protobuf}"))
  api(platform("com.google.cloud:libraries-bom:${versions.gcp}"))
  api(platform("software.amazon.awssdk:bom:${versions.awsv2}"))
  // awspring 3.x (Spring Cloud AWS on AWS SDK v2). Imported AFTER the awssdk BOM
  // so our pinned AWS SDK v2 version wins Gradle's first-declared conflict
  // resolution for Maven consumers. Used by kork-cloud-config-server for the
  // s3:// ResourceLoader (S3ProtocolResolver).
  api(platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.3.0"))
  api(platform("org.springframework.cloud:spring-cloud-dependencies:${versions.springCloud}"))
  api(platform("io.strikt:strikt-bom:0.31.0"))
  api(platform("org.spockframework:spock-bom:2.4-groovy-4.0"))
  api(platform("com.oracle.oci.sdk:oci-java-sdk-bom:3.21.0"))
  api(platform("io.arrow-kt:arrow-stack:${versions.arrow}"))
  constraints {
    api("cglib:cglib-nodep:3.3.0")
    api("com.google.api-client:google-api-client:2.4.1")
    api("com.google.apis:google-api-services-admin-directory:directory_v1-rev20240429-2.0.0")
    api("com.google.apis:google-api-services-cloudbuild:v1-rev20240427-2.0.0")
    api("com.google.apis:google-api-services-compute:v1-rev20250415-2.0.0")
    api("com.google.apis:google-api-services-iam:v1-rev20240502-2.0.0")
    api("com.google.apis:google-api-services-monitoring:v3-rev20240427-2.0.0")
    api("com.google.apis:google-api-services-storage:v1-rev20240319-2.0.0")
    api("com.google.apis:google-api-services-appengine:v1-rev20240415-2.0.0")
    api("com.google.apis:google-api-services-run:v1-rev20240426-2.0.0")
    api("com.google.cloud:google-cloud-secretmanager:2.37.0")
    api("com.google.code.findbugs:jsr305:3.0.2")
    api("com.google.guava:guava:33.0.0-jre")
    api("com.hubspot.jinjava:jinjava:2.8.3") // fixes CVE-2026-25526
    //TODO:  jsch moved to com.github.mwiede/jsch
    api("com.jcraft:jsch:${versions.jsch}")
    api("org.elasticsearch:elasticsearch:${versions.elasticsearch}")
    api("com.jcraft:jsch.agentproxy.connector-factory:${versions.jschAgentProxy}")
    api("com.jcraft:jsch.agentproxy.jsch:${versions.jschAgentProxy}")

    // Used in appengine.  Make sure to match the gradle plugin version.
    api('org.eclipse.jgit:org.eclipse.jgit:7.3.0.202506031305-r')
    api("org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:7.3.0.202506031305-r")

    api("com.netflix.archaius:archaius-core:0.7.7")
    api("com.netflix.awsobjectmapper:awsobjectmapper:${versions.aws}")
    api("com.netflix.dyno:dyno-jedis:1.7.2")
    api("com.netflix.eureka:eureka-client")
    api("com.netflix.frigga:frigga:0.28.0")
    api("com.netflix.netflix-commons:netflix-eventbus:0.3.0")
    api("com.netflix.spectator:spectator-api:${versions.spectator}")
    api("com.netflix.spectator:spectator-ext-aws2:${versions.spectator}")
    api("com.netflix.spectator:spectator-ext-ipc:${versions.spectator}")
    api("com.netflix.spectator:spectator-ext-gc:${versions.spectator}")
    api("com.netflix.spectator:spectator-ext-jvm:${versions.spectator}")
    api("com.netflix.spectator:spectator-nflx-plugin:${versions.spectator}")
    api("com.netflix.spectator:spectator-reg-atlas:${versions.spectator}")
    api("com.netflix.spectator:spectator-web-spring:${versions.spectator}")
    api("com.netflix.spectator:spectator-reg-micrometer:${versions.spectator}")
    api("com.nimbusds:nimbus-jose-jwt:10.9")
    api("com.ninja-squad:springmockk:4.0.2")  //Compatible with Spring boot 3.x and Java 17+ https://github.com/Ninja-Squad/springmockk?tab=readme-ov-file#versions-compatibility
    api("com.squareup.retrofit2:converter-jackson:${versions.retrofit2}")
    api("com.squareup.retrofit2:retrofit-mock:${versions.retrofit2}")
    api("com.squareup.retrofit2:retrofit:${versions.retrofit2}")
    api("com.sun.xml.bind:jaxb-core:2.3.0.1")
    api("com.sun.xml.bind:jaxb-impl:2.3.2")
    api("com.vdurmont:semver4j:3.1.0")
    api("commons-configuration:commons-configuration:1.8")
    api("commons-io:commons-io:2.22.0")
    api("commons-fileupload:commons-fileupload:1.6.0")// Multiple CVEs from 1.4
    api("org.apache.commons:commons-compress:${versions.commonsCompress}")
    // CVE's in 3.2.1
    api("commons-collections:commons-collections:[3.2.2,3.3)")
    api("org.apache.commons:commons-collections4:4.5.0")
    api("de.danielbechler:java-object-diff:0.95")
    api("de.huxhorn.sulky:de.huxhorn.sulky.ulid:8.2.0")
    api("dev.minutest:minutest:1.13.0")
    api("io.mockk:mockk:1.13.17")
    api("io.swagger.core.v3:swagger-annotations:${versions.swagger}")
    api("io.swagger.core.v3:swagger-core:${versions.swagger}")
    api("javax.xml.bind:jaxb-api:2.3.1")
    api("net.logstash.logback:logstash-logback-encoder:4.11")
    // No official logback BOM exists (qos-ch/logback removed logback-bom in 2017; the
    // internal logback-parent reactor POM is not documented/published for external
    // consumers to import as a platform), so we keep pinning these two explicitly.
    api("ch.qos.logback:logback-core:${versions.logback}")
    api("ch.qos.logback:logback-classic:${versions.logback}")
    // No official Tomcat BOM exists (no tomcat-embed-bom is published); Tomcat expects
    // consumers to pin org.apache.tomcat.embed:* artifacts individually, or via Spring
    // Boot's BOM, so we keep pinning these explicitly with a shared version variable.
    api("org.apache.tomcat.embed:tomcat-embed-core:${versions.tomcat}")
    api("org.apache.tomcat.embed:tomcat-embed-el:${versions.tomcat}")
    api("org.apache.tomcat.embed:tomcat-embed-websocket:${versions.tomcat}")
    api("org.apache.commons:commons-exec:1.3")
    api("org.apache.logging.log4j:log4j-api-kotlin:${versions.log4jKotlin}")
    api("org.bitbucket.b_c:jose4j:0.9.6")
    //  from BC 1.71, module names changed from *-jdk15on to *-jdk18on
    // due to this change, some of the modules in downstream services like clouddriver, gate would fall back to
    // lower versions(<1.70) as transitive dependencies. So to make them use BC >=1.74(CVE free versions),
    // the following dependencies are upgraded: oci-java-sdk-bom, google-cloud-secretmanager
    // and in some cases *-jdk15on libraries are excluded so as to use the available *-jdk18on or *-jdk15to18
    // some of the modules would still use <1.70 as they can't be upgraded without upgrading spring boot
    api('org.mockito.kotlin:mockito-kotlin:5.4.0')
    api("com.azure:azure-security-keyvault-keys:4.11.1") // CVE-2026-33117
    api("org.bouncycastle:bcpkix-jdk18on:${versions.bouncycastle}")
    api("org.bouncycastle:bcprov-jdk18on:${versions.bouncycastle}")
    api("org.bouncycastle:bcprov-jdk15to18:${versions.bouncycastle}") // CVE-2025-14813: some transitive deps still pull jdk15to18 artifact
    api("org.jetbrains:annotations:19.0.0")
    api("org.spekframework.spek2:spek-dsl-jvm:${versions.spek2}")
    api("org.spekframework.spek2:spek-runner-junit5:${versions.spek2}")
    api("org.jetbrains.spek:spek-api:${versions.spek}")
    api("org.jetbrains.spek:spek-junit-platform-engine:${versions.spek}")
    api("org.jetbrains.spek:spek-junit-platform-runner:${versions.spek}")
    api("org.jetbrains.spek:spek-subject-extension:${versions.spek}")
    api("org.objenesis:objenesis:2.5.1")
    api("org.pf4j:pf4j:3.14.1")
    api("org.pf4j:pf4j-update:2.3.0")
    api("org.springdoc:springdoc-openapi-starter-webmvc-ui:${versions.springdocs}")
    api("org.testcontainers:testcontainers-minio:${versions.testcontainersMinio}")
    api("org.threeten:threeten-extra:1.0")
  }
}
