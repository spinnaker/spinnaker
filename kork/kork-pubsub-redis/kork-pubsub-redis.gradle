apply plugin: 'java-library'
apply from: "$rootDir/gradle/lombok.gradle"

dependencies {
  api(platform(project(':spinnaker-dependencies')))

  implementation project(':kork-core')
  implementation project(':kork-pubsub')

  implementation 'org.springframework.boot:spring-boot-autoconfigure'
  implementation 'jakarta.validation:jakarta.validation-api'

  // spring-boot-starter-data-redis (not bare spring-data-redis) is required to pull in the
  // Lettuce client - without it Spring's RedisAutoConfiguration can't build a
  // RedisConnectionFactory/StringRedisTemplate. Matches clouddriver's cats-pubsub module, the only
  // other place in this monorepo doing Redis Streams consumer-group work.
  api 'org.springframework.boot:spring-boot-starter-data-redis'
  // Broadcast (native Redis pub/sub) is built on Spring Integration's mature Redis channel
  // adapters (RedisInboundChannelAdapter / RedisPublishingMessageHandler) rather than hand-rolled
  // RedisMessageListenerContainer wiring - see package-level docs in .redis.broadcast for why this
  // was NOT also adopted for the Streams/consumer-group side.
  api 'org.springframework.integration:spring-integration-redis'
  api 'io.micrometer:micrometer-core'
  api 'org.slf4j:slf4j-api'

  testImplementation project(':kork-jedis-test')
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}
