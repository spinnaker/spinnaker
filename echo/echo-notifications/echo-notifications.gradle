dependencies {
  implementation project(':echo-core')
  implementation project(':echo-model')
  implementation project(":echo-pipelinetriggers")
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "com.squareup.retrofit2:retrofit"
  implementation "io.spinnaker.kork:kork-core"
  implementation "io.spinnaker.kork:kork-artifacts"
  implementation "io.spinnaker.kork:kork-retrofit"
  implementation "io.spinnaker.kork:kork-web"
  implementation "commons-codec:commons-codec"
  implementation "org.springframework.boot:spring-boot-starter-mail"
  implementation "org.springframework.boot:spring-boot-starter-freemarker"
  implementation "com.hubspot.jinjava:jinjava"
  implementation "org.jsoup:jsoup:1.8.3"
  implementation "com.atlassian.commonmark:commonmark:0.9.0"
  implementation "org.apache.groovy:groovy-json"
  implementation "io.cloudevents:cloudevents-http-basic:3.0.0"
  implementation "io.cloudevents:cloudevents-json-jackson:3.0.0"
  implementation "tools.jackson.core:jackson-databind"
  // Version managed by the kork-bom platform (spinnaker-dependencies).
  implementation "dev.cdevents:cdevents-sdk-java"
  implementation "io.opentelemetry:opentelemetry-api"
  implementation "io.opentelemetry:opentelemetry-api-incubator"
  implementation "io.opentelemetry:opentelemetry-sdk"
  // OTLP exporter without its okhttp sender: sender-okhttp 1.62 requires
  // okhttp 5.x while the tree resolves okhttp 4.12.0, and the CDEvents sender
  // here uses the gRPC exporter, so the okhttp sender is unneeded. A newer
  // OTel release does not help while the okhttp major versions diverge.
  implementation("io.opentelemetry:opentelemetry-exporter-otlp") {
    exclude group: "io.opentelemetry", module: "opentelemetry-exporter-sender-okhttp"
  }
  testImplementation project(":echo-test")
  testImplementation("com.icegreen:greenmail:2.1.8")
  testImplementation "org.apache.httpcomponents.client5:httpclient5"
  testImplementation "org.spockframework:spock-spring"
  testImplementation "org.springframework:spring-test"
  testImplementation "com.squareup.retrofit2:retrofit-mock"
  // Shaded standalone directly: self-contained, no Jetty version at odds with
  // Boot 4.1's Jetty 12.1.x. Version from the kork-bom platform.
  testImplementation "org.wiremock:wiremock-standalone"
  testImplementation "org.assertj:assertj-core"
  testImplementation "io.opentelemetry:opentelemetry-sdk-testing"
  annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
}

sourceSets {
  main {
    java { srcDirs = [] }    // no source dirs for the java compiler
    groovy { srcDirs = ["src/main/java", "src/main/groovy"] }  // compile everything in src/ with groovy
  }
  test {
    resources {
      // Adds main resources to the test classpath
      srcDirs("src/main/resources")
    }
  }
}
