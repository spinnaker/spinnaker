plugins {
  id 'io.spinnaker.project' apply false
}

allprojects {
  apply plugin: 'io.spinnaker.project'
  group = "io.spinnaker.rosco"

  // WireMock 3.10.0's default Jetty 11 server (and the jetty12 variant's Jetty
  // 12.0.x) conflicts with Boot 4.1's managed Jetty 12.1.x on test classpaths
  // (HttpServerFactoryLoader finds no loadable factory). The shaded standalone
  // artifact is self-contained, so substitute it for all WireMock test usage.
  configurations.all {
    resolutionStrategy.dependencySubstitution {
      substitute module("org.wiremock:wiremock") using module(
          "org.wiremock:wiremock-standalone:3.10.0")
      substitute module("org.wiremock:wiremock-jetty12") using module(
          "org.wiremock:wiremock-standalone:3.10.0")
    }
  }
}

subprojects {
  if (name != "rosco-bom") {
    apply plugin: 'java-library'
    apply plugin: "groovy"

    dependencies {
      implementation enforcedPlatform("io.spinnaker.kork:kork-bom")

      compileOnly "org.projectlombok:lombok"

      annotationProcessor enforcedPlatform("io.spinnaker.kork:kork-bom")
      annotationProcessor "org.projectlombok:lombok"
      annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")

      testCompileOnly "org.projectlombok:lombok"

      testAnnotationProcessor enforcedPlatform("io.spinnaker.kork:kork-bom")
      testAnnotationProcessor "org.projectlombok:lombok"

      testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
      testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    }

    test {
      testLogging {
        exceptionFormat = 'full'
      }
      useJUnitPlatform()
    }
  }
  tasks.withType(JavaExec) {
    if (System.getProperty('DEBUG', 'false') == 'true') {
      jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=8187'
    }
  }

}
