- changeSet:
    id: verify-titus-verifications-removed
    author: jmcintosh
    preConditions:
      - onFail: HALT
      - onFailMessage: >
          Environments still reference the removed Titus 'test-container' verification (or the
          'promote-candidate-jar' post-deploy action). Remove those entries from the environment /
          preview_environment tables (or re-submit the affected delivery configs) and restart.
      - sqlCheck:
          expectedResult: 0
          sql: >
            select
                (select count(*) from environment
                  where json_search(verifications, 'one', 'test-container', null, '$[*].type') is not null
                     or json_search(post_deploy_actions, 'one', 'promote-candidate-jar', null, '$[*].type') is not null)
                + (select count(*) from preview_environment
                  where json_search(verifications, 'one', 'test-container', null, '$[*].type') is not null)
    changes:
    - tagDatabase:
        tag: titus-removed
